# Zero-dependency audit surface for the Android build graph.
#
# Started in Phase 17 as the minimal Kotlin/JVM + kotlinx-serialization + JUnit Jupiter
# catalog for the pure-JVM :insights module. Phases 18+ extend it with the Android/Room/
# DataStore coordinates from .planning/research/STACK.md — all first-party Maven
# (Google / JetBrains), never an analytics / auth / backend / networking coordinate.
# VersionCatalogAuditTests fails the build if a forbidden coordinate ever appears.

[versions]
kotlin = "2.3.21"
agp = "9.2.0"
ksp = "2.3.9"                    # standalone versioning since KSP 2.3.0; works with Kotlin 2.2+
composeBom = "2026.06.00"        # single version knob for all androidx.compose artifacts (Phase 19 UI)
activityCompose = "1.13.0"       # ComponentActivity.setContent host; own release train (not BOM-managed)
lifecycle = "2.10.0"             # lifecycle-runtime-compose; latest stable compatible with compileSdk 36 (2.11.0 requires compileSdk 37)
robolectric = "4.16.1"           # JVM Compose test harness; SDK 36 support requires JDK 21 (toolchain pinned)
room = "2.8.4"
datastore = "1.2.0"
work = "2.10.5"                  # androidx.work — inexact daily reminder scheduling; latest 2.10.x stable compatible with compileSdk 36 (2.11.x tracks a newer SDK, mirroring the lifecycle-2.10.0 pin)
healthConnect = "1.1.0"          # androidx.health.connect:connect-client — first-party read-only Health Connect broker (Phase 21). First & current stable (Oct 2025); the coordinate carries no analytics/auth/networking substring, so VersionCatalogAuditTests stays green.
junitJupiter = "6.1.1"
junit4 = "4.13.2"
androidxTestExtJunit = "1.3.0"
# androidx.test:runner — the AndroidJUnitRunner class itself. `androidx.test.ext:junit` does not
# bundle it, so the instrumentation APK fails to instantiate the runner without this dependency.
androidxTestRunner = "1.7.0"
kotlinxSerialization = "1.11.0"
kotlinxCoroutinesTest = "1.9.0"  # JVM virtual-time test lane (runTest/StandardTestDispatcher); pinned to the coroutines-core the app graph already resolves

[libraries]
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }
# JUnit 6 unifies Platform + Jupiter under one version; the launcher is required on the
# test runtime classpath (Gradle no longer auto-provides it) and is not a transitive dep
# of the Jupiter aggregator. Version-aligned with junitJupiter via junit-bom 6.1.1.
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitJupiter" }
# Room 2.8.4 (androidx.room) — persistence for the :app data layer. Coroutines/Flow support
# lives in room-runtime since 2.7 (do NOT add room-ktx). Compiler runs via KSP only (no kapt).
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
# DataStore (preferences) — consent flag + reminder prefs, OUTSIDE the health database.
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
# WorkManager (androidx.work) — the daily check-in reminder's INEXACT periodic scheduling. First-party
# androidx; survives reboot without an extra receiver and needs NO exact-alarm permission. work-testing
# drives the WorkManagerTestInitHelper/TestDriver lane that proves inexact-periodic enqueue on the JVM.
work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }
work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }
# Health Connect (androidx.health.connect) — the read-only import broker (Phase 21). First-party
# AndroidX Maven artifact; read-only client (4 health READ perms + READ_HEALTH_DATA_HISTORY, ZERO
# write). No analytics/auth/backend/networking coordinate — VersionCatalogAuditTests stays green.
health-connect-client = { group = "androidx.health.connect", name = "connect-client", version.ref = "healthConnect" }
# Jetpack Compose + Material 3 (Phase 19 UI shell). The BOM is the single version knob:
# every androidx.compose artifact below is declared versionless and pinned by compose-bom.
# All first-party androidx / JetBrains — never an analytics/auth/backend/networking coordinate.
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }                              # version from BOM
compose-material3 = { group = "androidx.compose.material3", name = "material3" }         # version from BOM
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" } # version from BOM
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }     # version from BOM
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" } # version from BOM
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
# Robolectric — the JVM Compose test lane (renders composables on the JVM, no emulator).
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
# JUnit 4 — the :app unit-test framework (AGP-native; Jupiter stays in :insights).
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
# androidx.test.ext:junit — the AndroidJUnit4 runner base for :app androidTest.
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
# kotlinx-coroutines-test — the JVM virtual-time unit-test lane (runTest / StandardTestDispatcher /
# advanceUntilIdle) that drives the InsightsCoordinator debounce + off-main recompute deterministically.
# First-party JetBrains; no analytics/auth/networking coordinate (VersionCatalogAuditTests stays green).
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }              # :insights only
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Compose compiler ships WITH Kotlin since 2.0 — pinned at the Kotlin version, never a separate compiler.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# AGP application plugin (built-in Kotlin under AGP 9 — :app does NOT apply kotlin.android).
android-application = { id = "com.android.application", version.ref = "agp" }
# KSP — Room's annotation processor (never kapt).
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
