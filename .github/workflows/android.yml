name: android

# Path-filtered merge gate for the Android monorepo tree (AENG-07). Only changes under
# android/** (or this workflow) trigger it, so the iOS build/test lanes stay independent.
# l10n/** also triggers it, because the Android tests enforce the shared DE/FR/ES policy data (SAFE-01).
on:
  push:
    paths:
      - 'android/**'
      - 'l10n/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'l10n/**'
      - '.github/workflows/android.yml'

jobs:
  insights-jvm:
    name: ':insights JVM tests'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run :insights tests
        run: ./gradlew :insights:test --console=plain --stacktrace

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insights-junit-xml
          path: android/insights/build/test-results/test/*.xml
          if-no-files-found: warn

  # The :app JVM merge gate — runs on every push and PR. Unit tests, Android Lint, and a
  # debug assemble prove the Android application module compiles under AGP 9 built-in Kotlin.
  app-jvm:
    name: ':app JVM tests + lint + assemble'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run :app JVM lane
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain --stacktrace

      - name: Upload :app JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-junit-xml
          path: android/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn

  # Instrumentation lane — main-only (push to main), because emulator runs are slow/costly.
  # There are no androidTests until Plan 02/03 land the Room MigrationTestHelper suite; an
  # empty connected run passes, so this is a safe forward-wire of the emulator gate.
  app-instrumentation:
    name: ':app connected androidTest (emulator, main-only)'
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run :app connected androidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain --stacktrace
