# XcodeGen spec for Endo-App (D-12, GSD iOS scaffold rule).
# COMMIT this file; the generated *.xcodeproj is gitignored and regenerated by `xcodegen generate`.
#
# IDENTITY — FROZEN 2026-10-31 (before the first store upload; bundle ids are permanent):
#   - Display name "OpenEndo" (CFBundleDisplayName in Info.plist)
#   - Bundle id "app.openendo.ios", iCloud container "iCloud.app.openendo.ios"
# Changing either after the first upload means a NEW App Store record.
#
# NOTE: CloudKit is ACTIVATED (runtime-gated) in Phase 4 (D-01/D-10/D-21). The iCloud(CloudKit)
# entitlement + Background-Modes (remote-notification) now ship via CODE_SIGN_ENTITLEMENTS below,
# but stay INERT until a real DEVELOPMENT_TEAM is set AND an iCloud account is signed in at runtime
# (SyncMode.resolve). Simulator builds are unsigned, so CI stays green with no team (A1).
name: EndoApp
options:
  bundleIdPrefix: app.openendo
  deploymentTarget:
    iOS: "18.0"            # D-12
settings:
  SWIFT_VERSION: "6.0"
  IPHONEOS_DEPLOYMENT_TARGET: "18.0"
# Phase 5 (D-09): the Foundation-only local SPM package. Its Package.swift declares ZERO
# dependencies — the compiler/linker is the SC1 boundary (no SwiftData/SwiftUI can sneak in).
packages:
  EndoInsights:
    path: EndoInsights
targets:
  EndoApp:
    type: application
    platform: iOS
    sources:
      - Sources/EndoApp
      # SAFE-01/SAFE-02: the shared DE/FR/ES claims-policy data, bundled as resources so the app decodes
      # the reviewed files at runtime. glossary.json and README.md are deliberately NOT bundled (test-only
      # data, read through #filePath), and `xcodegen generate` must re-run after any edit here.
      - path: l10n
        includes:
          - "claims-policy.*.json"
        buildPhase: resources
    dependencies:
      # App depends on the package library product (product defaults to the package name).
      - package: EndoInsights
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.openendo.ios
      TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad (1.0 ships both)
      INFOPLIST_FILE: Sources/EndoApp/Resources/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      CODE_SIGN_ENTITLEMENTS: Sources/EndoApp/Resources/EndoApp.entitlements
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # DEVELOPMENT_TEAM: ABCDE12345   # <-- USER: uncomment + set to activate real device sync (D-02)
    scheme:
      testTargets:
        - EndoAppTests
        - EndoAppUITests
        # THE KEY LINE (Phase 5 SC3) — run the package's Swift Testing tests in the app scheme.
        # Syntax: package: <local-package-name>/<test-target-name> (XcodeGen >= 2.27.0; installed 2.45.4).
        - package: EndoInsights/EndoInsightsTests
  EndoAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/EndoAppTests
    settings:
      GENERATE_INFOPLIST_FILE: YES   # unit-test bundle has no hand-written Info.plist; let Xcode synthesize one
    dependencies:
      - target: EndoApp
  EndoAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/EndoAppUITests
    settings:
      GENERATE_INFOPLIST_FILE: YES   # UI-test bundle has no hand-written Info.plist; let Xcode synthesize one
    dependencies:
      - target: EndoApp
