# XcodeGen spec for Endo-App (D-12, GSD iOS scaffold rule).
# COMMIT this file; the generated *.xcodeproj is gitignored and regenerated by `xcodegen generate`.
#
# PLACEHOLDER IDENTITY (D-09 — finalize at Apple Developer enrollment / branding):
#   - Display name "Endo-App" (CFBundleDisplayName in Info.plist)
#   - Placeholder bundle id "com.endoapp.ios"
#   Both are provisional and MUST be revisited when a real app name + Developer team are chosen.
#
# NOTE: CloudKit is ACTIVATED (runtime-gated) in Phase 4 (D-01/D-10/D-21). The iCloud(CloudKit)
# entitlement + Background-Modes (remote-notification) now ship via CODE_SIGN_ENTITLEMENTS below,
# but stay INERT until a real DEVELOPMENT_TEAM is set AND an iCloud account is signed in at runtime
# (SyncMode.resolve). Simulator builds are unsigned, so CI stays green with no team (A1).
name: EndoApp
options:
  bundleIdPrefix: com.endoapp
  deploymentTarget:
    iOS: "18.0"            # D-12
settings:
  SWIFT_VERSION: "6.0"
  IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  EndoApp:
    type: application
    platform: iOS
    sources:
      - Sources/EndoApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.endoapp.ios   # D-09 placeholder, flagged to finalize
      INFOPLIST_FILE: Sources/EndoApp/Resources/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      CODE_SIGN_ENTITLEMENTS: Sources/EndoApp/Resources/EndoApp.entitlements
      CODE_SIGN_STYLE: Automatic
      # DEVELOPMENT_TEAM: ABCDE12345   # <-- USER: uncomment + set to activate real device sync (D-02)
    scheme:
      testTargets:
        - EndoAppTests
        - EndoAppUITests
  EndoAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/EndoAppTests
    settings:
      GENERATE_INFOPLIST_FILE: YES   # unit-test bundle has no hand-written Info.plist; let Xcode synthesize one
    dependencies:
      - target: EndoApp
  EndoAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/EndoAppUITests
    settings:
      GENERATE_INFOPLIST_FILE: YES   # UI-test bundle has no hand-written Info.plist; let Xcode synthesize one
    dependencies:
      - target: EndoApp
