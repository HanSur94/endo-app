# XcodeGen spec for Endo-App (D-12, GSD iOS scaffold rule).
# COMMIT this file; the generated *.xcodeproj is gitignored and regenerated by `xcodegen generate`.
#
# PLACEHOLDER IDENTITY (D-09 — finalize at Apple Developer enrollment / branding):
#   - Display name "Endo-App" (CFBundleDisplayName in Info.plist)
#   - Placeholder bundle id "com.endoapp.ios"
#   Both are provisional and MUST be revisited when a real app name + Developer team are chosen.
#
# NOTE: do NOT add the iCloud/CloudKit or Background-Modes capability in Phase 1 —
# SyncMode.localOnly (.none) needs none of it; capabilities are added in Phase 4 when sync flips on (D-10/D-21).
name: EndoApp
options:
  bundleIdPrefix: com.endoapp
  deploymentTarget:
    iOS: "18.0"            # D-12
settings:
  SWIFT_VERSION: "6.0"
  IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  EndoApp:
    type: application
    platform: iOS
    sources:
      - Sources/EndoApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.endoapp.ios   # D-09 placeholder, flagged to finalize
      INFOPLIST_FILE: Sources/EndoApp/Resources/Info.plist
      GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - EndoAppTests
  EndoAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/EndoAppTests
    settings:
      GENERATE_INFOPLIST_FILE: YES   # unit-test bundle has no hand-written Info.plist; let Xcode synthesize one
    dependencies:
      - target: EndoApp
